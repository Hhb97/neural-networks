<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformer Self-Attention 可视化</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: #F5F4EF; color: #2C2C2A;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 10px; }
  .sub { color: #5F5E5A; font-size: 14px; margin-bottom: 18px; }
  .back { display: inline-block; margin-bottom: 14px; color: #185FA5; text-decoration: none; font-size: 14px; }
  .back:hover { text-decoration: underline; }
  .card { background: #fff; border: 1px solid #D3D1C7; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .row > .card { flex: 1; min-width: 300px; margin-bottom: 0; }
  .head-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .head-btn {
    flex: 1; text-align: center; padding: 9px; border-radius: 10px; cursor: pointer;
    border: 2px solid #E5E3DB; background: #F1EFE8; font-size: 13.5px;
  }
  .head-btn.active { border-color: #185FA5; background: #E8F1FB; font-weight: 500; color: #185FA5; }
  .tokens { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .token {
    padding: 9px 14px; border-radius: 8px; background: #F1EFE8; font-size: 15px; cursor: pointer;
    border: 2px solid transparent; user-select: none;
  }
  .token.sel { border-color: #185FA5; background: #E8F1FB; font-weight: 500; }
  .bars { margin-top: 14px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-row .w { width: 46px; font-size: 14px; text-align: right; }
  .bar-bg { flex: 1; background: #F1EFE8; border-radius: 6px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; background: #185FA5; border-radius: 6px; transition: width .2s ease; }
  .bar-row .val { width: 52px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: #5F5E5A; }
  table.heat { border-collapse: collapse; font-size: 12px; }
  table.heat th, table.heat td { padding: 4px 6px; text-align: center; }
  table.heat th { color: #5F5E5A; font-weight: 500; font-size: 11.5px; }
  table.heat td { border-radius: 4px; font-variant-numeric: tabular-nums; color: #1A1A18; }
  .readout {
    background: #F1EFE8; border-radius: 8px; padding: 12px 16px; margin-top: 12px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px;
    white-space: pre; line-height: 1.8; overflow-x: auto;
  }
  .hint { font-size: 13px; color: #5F5E5A; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">&larr; 返回首页</a>
  <h1>Self-Attention 可视化：每个词在关注谁</h1>
  <div class="sub">
    点一个词当作 Query，看它对句子里每个词（包括自己）分配了多少"关注度"。
    对应笔记：《神经网络进阶：Transformer》第 2～5 节。
  </div>

  <div class="card">
    <h3>选择注意力头（对应第 5 节：多头注意力）</h3>
    <div class="head-row" id="headRow">
      <div class="head-btn active" data-h="full">不分头（完整向量）</div>
      <div class="head-btn" data-h="0">头 1</div>
      <div class="head-btn" data-h="1">头 2</div>
    </div>

    <h3>点一个词作为 Query</h3>
    <div class="tokens" id="tokenRow"></div>
  </div>

  <div class="row">
    <div class="card">
      <h3 id="barsTitle">对各个词的关注度</h3>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <h3>完整注意力矩阵（行=Query，列=Key）</h3>
      <div style="overflow-x:auto"><table class="heat" id="heat"></table></div>
    </div>
  </div>

  <div class="card">
    <h3>计算过程</h3>
    <div class="readout" id="readout"></div>
  </div>

</div>

<script>
// 4 维手工向量：让 "它" 同时和 "猫"、"垫子" 有点像，"软" 和 "垫子" 更像
const TOKENS = [
  { w: '猫',   v: [1.00, 0.20, 0.10, 0.00] },
  { w: '躺在', v: [0.00, 1.00, 0.00, 0.10] },
  { w: '垫子', v: [0.90, 0.10, 1.00, 0.20] },
  { w: '上',   v: [0.00, 0.30, 0.20, 0.00] },
  { w: '因为', v: [0.10, 0.00, 0.10, 0.90] },
  { w: '它',   v: [0.95, 0.15, 0.85, 0.10] },
  { w: '很',   v: [0.00, 0.10, 0.00, 0.30] },
  { w: '软',   v: [0.10, 0.00, 0.90, 0.20] },
];

const HEAD_DIMS = { full: [0,1,2,3], '0': [0,1], '1': [2,3] };

let selHead = 'full';
let selQuery = 5; // 默认选中 "它"

function dot(a, b, dims) {
  return dims.reduce((s, d) => s + a[d]*b[d], 0);
}

function softmax(arr) {
  const ex = arr.map(Math.exp);
  const sum = ex.reduce((a,b)=>a+b, 0);
  return ex.map(e => e/sum);
}

function computeMatrix(dims) {
  const scale = Math.sqrt(dims.length);
  const n = TOKENS.length;
  const scores = [];
  for (let i = 0; i < n; i++) {
    const row = [];
    for (let j = 0; j < n; j++) row.push(dot(TOKENS[i].v, TOKENS[j].v, dims) / scale);
    scores.push(row);
  }
  const weights = scores.map(row => softmax(row));
  return { scores, weights };
}

function renderTokens() {
  const row = document.getElementById('tokenRow');
  row.innerHTML = TOKENS.map((t,i) =>
    `<div class="token${i===selQuery?' sel':''}" data-i="${i}">${t.w}</div>`
  ).join('');
  row.querySelectorAll('.token').forEach(el => {
    el.addEventListener('click', () => { selQuery = parseInt(el.dataset.i); renderAll(); });
  });
}

function renderHeadRow() {
  document.querySelectorAll('.head-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.h === selHead);
  });
}

function colorFor(w) {
  const alpha = Math.min(1, w * 2.2);
  return `rgba(24,95,165,${alpha.toFixed(2)})`;
}

function renderBars(weights) {
  const el = document.getElementById('bars');
  document.getElementById('barsTitle').textContent = `「${TOKENS[selQuery].w}」对各个词的关注度`;
  const wRow = weights[selQuery];
  el.innerHTML = TOKENS.map((t,j) => `
    <div class="bar-row">
      <div class="w">${t.w}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${(wRow[j]*100).toFixed(1)}%"></div></div>
      <div class="val">${(wRow[j]*100).toFixed(1)}%</div>
    </div>
  `).join('');
}

function renderHeat(weights) {
  const table = document.getElementById('heat');
  let html = '<tr><th></th>' + TOKENS.map(t=>`<th>${t.w}</th>`).join('') + '</tr>';
  weights.forEach((row, i) => {
    html += `<tr><th>${TOKENS[i].w}</th>` + row.map((w,j) => {
      const border = (i===selQuery) ? 'box-shadow: inset 0 0 0 2px #185FA5;' : '';
      return `<td style="background:${colorFor(w)};${border}">${(w*100).toFixed(0)}</td>`;
    }).join('') + '</tr>';
  });
  table.innerHTML = html;
}

function renderReadout(scores, weights) {
  const dims = HEAD_DIMS[selHead];
  const scale = Math.sqrt(dims.length);
  const q = TOKENS[selQuery];
  let out = `Query = 「${q.w}」   使用维度 [${dims.join(',')}]   缩放 √d_k = ${scale.toFixed(2)}\n\n`;
  out += `第一步：Query 和每个 Key 做点积，除以 √d_k\n`;
  TOKENS.forEach((t,j) => {
    out += `  score(${q.w}, ${t.w}) = ${scores[selQuery][j].toFixed(3)}\n`;
  });
  out += `\n第二步：Softmax 归一化 → 注意力权重（加起来 = 1）\n`;
  TOKENS.forEach((t,j) => {
    out += `  weight(${q.w}→${t.w}) = ${(weights[selQuery][j]*100).toFixed(1)}%\n`;
  });
  const maxJ = weights[selQuery].indexOf(Math.max(...weights[selQuery].filter((_,j)=>j!==selQuery)));
  document.getElementById('readout').textContent = out;
}

function renderAll() {
  const dims = HEAD_DIMS[selHead];
  const { scores, weights } = computeMatrix(dims);
  renderTokens();
  renderHeadRow();
  renderBars(weights);
  renderHeat(weights);
  renderReadout(scores, weights);
}

document.getElementById('headRow').querySelectorAll('.head-btn').forEach(btn => {
  btn.addEventListener('click', () => { selHead = btn.dataset.h; renderAll(); });
});

renderAll();
</script>
</body>
</html>
